name: update-lock

# flake.lock ages on its own and nothing else here moves it: dependabot watches only the
# uses: pins. This takes every input's current revision weekly, runs build.yml itself
# against the bump, and lands it only on green; red leaves the dated branch standing, with
# the bump on it, for a human to look at
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Two runs would push the same branch from different bases
concurrency: update-lock

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      moved: ${{ steps.push.outputs.moved }}
    steps:
      # Full history: pushing from a shallow clone is refused
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - id: push
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "every input is already current"
            echo "moved=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=flake-lock/$(date -u +%Y-%m-%d)
          git switch -c "$branch"
          git commit -qam "take every input's current revision"
          git push -f origin "$branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "moved=1" >>"$GITHUB_OUTPUT"

  # The whole point of the temp branch: a reusable workflow checks out a ref, so the bump
  # has to exist somewhere before the checks can see it
  verify:
    needs: bump
    if: needs.bump.outputs.moved == '1'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  # Red leaves the branch alone, with the bump on it, so the failure can be looked at
  land:
    needs: [bump, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
      # GITHUB_REF_NAME is the branch the run started on: the default branch for the weekly
      # schedule, whose event carries no repository payload to read the default branch from
      - name: fast-forward the branch the run started on onto the verified tree
        env:
          BRANCH: ${{ needs.bump.outputs.branch }}
        run: |
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin --delete "$BRANCH"
