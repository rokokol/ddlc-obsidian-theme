name: macos

# The behaviour half of the gate under the bash macOS ships. A script that claims
# "Needs bash 3.2 and POSIX tools only" is proven here, under the real /bin/bash 3.2 on
# a macOS runner, with constructs planted that only a 3.2 rejects — a grep for newer
# syntax is a proxy, and this is the mechanism. A repository takes this file only when
# one of its scripts makes that claim; a Linux-only tool has nothing to prove here and
# does not carry it. Its own workflow file, so the claim gets its own badge
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bash32:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: the behaviour half under the bash macOS ships
        env:
          CHECK_BASH32: "1"
        run: |
          /bin/bash --version
          /bin/bash ./check.sh behaviour
