name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The cascades and the release run this workflow, not a copy of its commands, against
  # the ref they are about; without workflow_call + ref they would check master instead
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # The whole gate, lint and behaviour, with every tool from flake.lock
      - run: nix develop -c ./check.sh
